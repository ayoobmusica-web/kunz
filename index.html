<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunz · Photographes à Nyon</title>
<meta name="description" content="Gestion de projet de l’exposition Kunz, photographes à Nyon">
<meta name="theme-color" content="#0B0E09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<style>
@font-face{font-family:'Unit Web';src:url('fonts/UnitWeb-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Unit Web';src:url('fonts/UnitWeb-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:#0B0E09; --card:#151A12; --card2:#1D2419; --line:#232A1E; --sunk:#0F130C; --edge:#4A5641;
  --text:#F3F4EC; --muted:#B9C0AE; --faint:#A3AC98; --soft:#C9CDBE; --gone:#8F9886;
  --accent:#cdce00; --late:#ec6907; --p:#65b32e; --l:#c3bd7a; --d:#cdce00;
  --display:'Unit Web','Helvetica Neue',Arial,sans-serif;
  --body:'Unit Web','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
ul,ol{list-style:none;margin:0;padding:0}

/* Écran de chargement */
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg);transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .photo{flex:1 1 64%;min-height:0;background:#0B0E09 url('img/kunz-photo.jpg') center 42%/cover no-repeat}
#splash .band{flex:0 0 auto;padding:28px 26px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;color:var(--accent)}
#splash .k{font-family:var(--display);font-weight:700;font-size:96px;line-height:.82;margin:0;letter-spacing:-.01em}
#splash .ph{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:10px 0 0}
#splash .gp{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
#splash .gp:before{content:"";width:32px;height:3px;background:var(--accent)}
#splash .bar{height:3px;background:rgba(205,206,0,.22);border-radius:2px;overflow:hidden}
#splash .bar i{display:block;height:3px;width:0;background:var(--accent);animation:load 2.4s ease forwards}
@keyframes load{to{width:100%}}
@media (min-width:760px){#splash{flex-direction:row}#splash .photo{flex:1 1 55%}#splash .band{flex:0 0 420px;justify-content:flex-end;padding:48px}}
@media (prefers-reduced-motion:reduce){#splash .bar i{animation:none;width:100%}#splash{transition:none}}

/* Barre du haut */
header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;background:rgba(11,14,9,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--card2)}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--accent);font-family:var(--display)}
.brand b{font-weight:700;font-size:28px;line-height:.85}
.brand span{font-weight:700;font-size:15px;line-height:1}
nav.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border-radius:24px;max-width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{height:40px;padding:0 16px;border:0;border-radius:20px;background:transparent;color:var(--soft);font-weight:700;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--bg)}
.search{flex:1 1 220px;display:flex;justify-content:flex-end;min-width:0}
.search label{flex:0 1 340px;min-width:0;height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-radius:21px;color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text)}
.search input::placeholder{color:var(--faint)}
@media (max-width:640px){header{gap:10px 12px;padding-left:16px;padding-right:16px}.brand span{display:none}nav.tabs{order:3;width:100%}nav.tabs button{flex:1;padding:0 8px}.search{flex:1 1 120px}}

/* Contenu */
main{position:relative;max-width:1200px;margin:0 auto;padding:24px 20px calc(56px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
@media (max-width:640px){main{padding-left:14px;padding-right:14px}}
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px}
.pagehead small{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--muted);font-size:14px}
#sync{display:inline-flex;align-items:center;gap:6px}
#sync:before{content:"";width:8px;height:8px;border-radius:4px;background:var(--faint)}
#sync.ok:before{background:var(--p)}
#sync.warn:before{background:var(--late)}
h1{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05}
.view{display:flex;flex-direction:column;gap:28px}
.card{background:var(--card);border-radius:18px}
.empty{margin:0;padding:16px 18px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:4px;flex-shrink:0;display:inline-block}
.badge{min-width:26px;height:26px;padding:0 8px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--line);color:var(--soft)}
.badge.hi{background:var(--accent);color:var(--bg)}
.note{font-size:14px;color:var(--faint);margin:0;line-height:1.45}
.btn{min-height:46px;padding:0 20px;border-radius:23px;border:1.5px solid transparent;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--bg)}
.btn.sec{background:transparent;color:var(--text);border-color:var(--edge)}
.btn.warn{background:transparent;color:var(--late);border-color:var(--late)}
.btn.warn.armed{background:var(--late);color:var(--bg)}
.btn.small{min-height:40px;padding:0 16px;font-size:14px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tag.late{background:var(--late);color:var(--bg)}
.tag.today{background:var(--accent);color:var(--bg)}
.tag.week{border:1.5px solid var(--accent);color:var(--accent)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.check{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:22px;background:transparent;padding:0;color:var(--bg)}
.check i{width:28px;height:28px;border-radius:14px;border:2px solid #5A6750;display:flex;align-items:center;justify-content:center}
.check.on i{border-color:var(--accent);background:var(--accent)}
.check svg{opacity:0}
.check.on svg{opacity:1}
.more{align-self:flex-start;min-height:42px;padding:0 18px;border:1.5px solid var(--edge);border-radius:21px;background:transparent;font-weight:700;color:var(--text)}

/* Accueil */
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.countdown{flex:1 1 340px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;padding:18px 22px;background:var(--accent);color:var(--bg);border-radius:22px}
.countdown b{font-family:var(--display);font-weight:700;font-size:68px;line-height:.85}
.countdown span{font-weight:700;font-size:16px}
.hero .acts{flex:1 1 260px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.colhead{display:flex;align-items:center;gap:12px;padding:0 2px 12px;margin-bottom:4px;border-bottom:2px solid var(--accent)}
.colhead .num{width:38px;height:38px;border-radius:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;border:2px solid var(--accent);color:var(--accent)}
.colhead .num.full{background:var(--accent);color:var(--bg)}
.colhead b{display:block;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.colhead small{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:2px;padding-right:4px;background:var(--card);border-radius:16px}
.topen{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:10px 6px 10px 14px;border:0;background:transparent;text-align:left;border-radius:16px;color:var(--text)}
.tdate{width:42px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.tdate b{font-family:var(--display);font-weight:700;font-size:24px;line-height:.95}
.tdate span{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tdate.late b{color:var(--late)}
.tdate.none b{font-size:20px;color:var(--faint)}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tt{font-weight:700;font-size:15px;line-height:1.25}
.ts{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);line-height:1.3}
.task.done .tt{color:var(--gone);text-decoration:line-through}
.task.done .tdate b{color:var(--gone)}
.jalons{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px 14px;padding:20px 22px;background:var(--card);border-radius:20px}
.jalons li{position:relative;border-top:3px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:3px}
.jalons li:before{content:"";position:absolute;top:-9px;left:0;width:15px;height:15px;border-radius:8px;border:3px solid var(--accent);background:var(--bg)}
.jalons li.v:before{background:var(--accent)}
.jalons li.past{opacity:.6}
.jalons b{font-size:15px}
.jalons span{font-size:14px;color:var(--muted)}

/* Supports */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.toolbar .scroller{flex:1 1 300px;min-width:0}
.chip{flex-shrink:0;height:38px;padding:0 14px;border:0;border-radius:19px;background:var(--card);color:var(--soft);font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.stable{width:100%;border-collapse:separate;border-spacing:0}
.stable thead th{position:sticky;top:var(--hh,72px);z-index:5;background:var(--bg);box-shadow:0 1px 0 var(--card2);padding:12px 10px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;white-space:nowrap}
.stable tr.ph th{padding:24px 10px 10px;text-align:left;border-bottom:2px solid var(--accent)}
.stable tr.ph th span.h{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;margin-right:10px;vertical-align:middle}
.stable tr.ph.donegrp th{border-bottom-color:var(--edge)}
.stable tr.srow > *{padding:12px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px;font-weight:400}
.stable tr.srow:hover > *{background:rgba(255,255,255,.02)}
.sname{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:0;border:0;background:transparent;text-align:left;color:var(--text);max-width:300px}
.sname b{font-size:15px;line-height:1.25;text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:3px}
.sname:hover b{text-decoration-color:var(--accent)}
.sname span{font-size:13px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srow.done .sname b{color:var(--gone);text-decoration:line-through}
td.dt{white-space:nowrap;font-variant-numeric:tabular-nums}
td.dt.dif{font-weight:700}
td.dt.late{color:var(--late);font-weight:700}
td.dt.ok{color:var(--gone)}
td.dt.ok:after{content:" ✓";color:var(--accent);font-weight:700}
td.dt.nd{color:var(--faint)}
td.ou{color:var(--soft);min-width:130px}
td.qui{min-width:110px}
.stw{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--sunk);border-radius:19px}
.seg button{height:34px;padding:0 11px;border:0;border-radius:16px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"].v0{background:var(--line);color:var(--text)}
.seg button[aria-pressed="true"].v1{background:var(--l);color:var(--bg)}
.seg button[aria-pressed="true"].v2{background:var(--accent);color:var(--bg)}
@media (max-width:900px){
  .stable thead{display:none}
  .stable,.stable tbody,.stable tr,.stable th,.stable td{display:block}
  .stable tr.ph th{padding:20px 2px 10px}
  .stable tr.srow{display:flex;flex-wrap:wrap;gap:12px 0;padding:14px 16px;margin-top:8px;background:var(--card);border-radius:18px}
  .stable tr.srow > *{padding:0;border:0;background:transparent!important}
  .stable tr.srow th{flex:1 1 100%}
  .sname{max-width:none}
  .stable td.dt{flex:1 1 33%;display:flex;flex-direction:column;gap:3px;white-space:normal}
  .stable td.ou,.stable td.qui{flex:1 1 100%;display:flex;gap:8px;min-width:0}
  .stable td[data-label]:before{content:attr(data-label);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-variant-numeric:normal}
  .stable td.ou:before,.stable td.qui:before{flex:0 0 64px;padding-top:2px}
  .stable td.dt.ok:after{content:"✓ fait";font-size:12px}
  .stable td.stc{flex:1 1 100%}
  .stw{flex-direction:row;flex-wrap:wrap;align-items:center}
  .stable td.stc:before{display:none}
}

/* Tiroir */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);border:0;padding:0}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:25;width:600px;max-width:100%;overflow-y:auto;background:var(--card);border-left:1px solid var(--line);box-shadow:-24px 0 48px rgba(0,0,0,.45);padding:calc(22px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;outline:none}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:var(--line);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.close{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:22px;background:var(--line);padding:0}
.fld{display:flex;flex-direction:column;gap:6px}
.fld > label,.fld > .lab,fieldset legend{font-size:13px;font-weight:700;color:var(--soft)}
.inp{width:100%;min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--sunk);color:var(--text)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{padding:12px 14px;line-height:1.45;resize:vertical}
.inp.big{font-weight:700;font-size:19px}
input[type="date"].inp{color-scheme:dark}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.err{color:var(--late);font-weight:700;font-size:14px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
fieldset legend{padding:0;margin-bottom:6px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,190px) auto;gap:10px;align-items:center;padding:8px 8px 8px 14px;background:var(--sunk);border-radius:16px}
.drow label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.drow .inp{min-height:42px;background:var(--card)}
.stepbtn{height:40px;padding:0 12px;border:1.5px solid var(--edge);border-radius:20px;background:transparent;color:var(--soft);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stepbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.stepbtn:disabled{opacity:.35;cursor:default}
@media (max-width:520px){.drow{grid-template-columns:1fr auto;padding:10px 10px 10px 14px}.drow label{grid-column:1/-1}}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{min-height:38px;padding:0 13px;border:1.5px solid var(--edge);border-radius:19px;background:transparent;color:var(--soft);font-weight:700;font-size:14px}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.addp{display:flex;gap:8px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:4px}
.actions .spacer{flex:1}

/* Budget */
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1 1 200px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:640px){.stat{flex:1 1 calc(50% - 5px);padding:14px}.stat b{font-size:23px!important}.stat small{font-size:12px!important}}
.stat b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;white-space:nowrap}
.stat small{font-size:13px;color:var(--muted)}
.stat.hi{background:var(--accent);color:var(--bg)}
.stat.hi .eyebrow,.stat.hi small{color:var(--bg)}
.stat.over{background:var(--late);color:var(--bg)}
.stat.over .eyebrow,.stat.over small{color:var(--bg)}
.sbar{display:flex;flex-direction:column;gap:8px}
.sbar .track{height:12px;display:flex;background:var(--line);border-radius:6px;overflow:hidden}
.sbar .track i{display:block;height:12px}
.sbar .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.sbar .legend span{display:flex;align-items:center;gap:6px}
.btab{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(0,2.3fr) repeat(4,minmax(110px,1fr)) 44px;gap:8px;align-items:center;padding:10px 10px 10px 12px;background:var(--card);border-radius:16px}
.brow.head{background:transparent;padding:0 10px 4px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brow.head span:not(:first-child){text-align:right;padding-right:12px}
.brow.sub{background:var(--card2)}
.brow.sub .bname{position:relative;padding-left:24px}
.brow.sub .bname:before{content:"↳";position:absolute;left:6px;top:9px;color:var(--faint)}
.brow.tot{background:var(--card2);font-weight:700}
.brow.tot .bname{padding-left:8px;font-size:16px}
.bname{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{width:100%;height:40px;padding:0 8px;border:1.5px solid transparent;border-radius:10px;background:transparent;color:var(--text);font-weight:700;font-size:16px}
.ds{width:100%;height:30px;padding:0 8px;border:1.5px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:13px}
.nm:hover,.ds:hover{border-color:var(--line)}
.nm:focus,.ds:focus{outline:none;border-color:var(--accent);background:var(--sunk)}
.ds::placeholder{color:#6F7966}
.bcell{min-width:0;display:flex;flex-direction:column;gap:3px}
.amtw{position:relative;display:flex;align-items:center}
.amt{width:100%;height:42px;padding:0 12px;border:1.5px solid transparent;border-radius:12px;background:var(--sunk);color:var(--text);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.amt::placeholder{color:#5F6957;font-weight:400}
.amt:focus{outline:none;border-color:var(--accent)}
.amt.dirty{padding-right:46px}
.amt.saved{border-color:var(--p)}
.amt.bad{border-color:var(--late)}
.ok{display:none;position:absolute;right:4px;width:36px;height:34px;align-items:center;justify-content:center;border:0;border-radius:9px;background:var(--accent);color:var(--bg);padding:0}
.amt.dirty + .ok{display:flex}
.out{display:block;text-align:right;font-weight:700;padding:0 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.out.calc{color:var(--soft);font-weight:400}
.out.neg{color:var(--late)}
.rep{grid-column:1/-1;margin:-2px 0 0 8px;font-size:13px;color:var(--muted)}
.rep.neg{color:var(--late)}
.bdel{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:20px;background:transparent;color:var(--faint);padding:0;font-size:20px;line-height:1}
.bdel:hover{background:var(--line);color:var(--text)}
.bdel.armed{width:auto;padding:0 10px;background:var(--late);color:var(--bg);font-size:12px;font-weight:700;border-radius:14px;white-space:nowrap}
.sublink{align-self:flex-start;min-height:32px;margin:2px 0 0 4px;padding:0 10px;border:1.5px dashed var(--edge);border-radius:16px;background:transparent;color:var(--soft);font-weight:700;font-size:12px}
.sublink:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:760px){
  .brow{grid-template-columns:1fr 1fr 1fr;padding:12px;position:relative}
  .brow.head{display:none}
  .brow .bname{grid-column:1/-1;padding-right:44px}
  .brow .bcell:before{content:attr(data-label);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-left:4px}
  .brow .bcell.dispo{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;padding-top:4px;border-top:1px solid var(--line)}
  .brow .bcell.dispo .out{padding-right:4px}
  .brow .amt{padding:0 8px}
  .brow > .bdel{position:absolute;top:10px;right:8px}
  .out{padding:0 8px}
}

/* Contacts */
.contacts{display:flex;flex-wrap:wrap;gap:10px}
.contact{flex:1 1 300px;display:flex;gap:14px;align-items:center;padding:16px}
.avatar{width:46px;height:46px;flex-shrink:0;border-radius:23px;color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.contact .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.small{font-size:13px;color:var(--muted)}
.ctag{flex-shrink:0;height:26px;padding:0 10px;display:flex;align-items:center;border-radius:13px;background:var(--line);color:var(--accent);font-size:12px;font-weight:700;white-space:nowrap}

.foot{margin-top:18px;padding-top:20px;border-top:1px solid var(--card2);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.foot .note{flex:1 1 320px}
.footbtns{display:flex;flex-wrap:wrap;gap:8px}
.footbtns label{cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:22px;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

      var inp = document.getElementById('f-np'), nm = inp ? inp.value.trim() : '';
      if (!nm) { if (inp) inp.focus(); return; }
      var l2 = P.kind === 'sup' ? X.q : X.qui; if (l2.indexOf(nm) < 0) l2.push(nm);
      if (P.id) { save(); renderView(); }
      renderPanel(); refocus('#f-np'); return;
    }
    if (b.hasAttribute('data-dstep') && P.id) { toggleStep(X, a('data-dstep')); save(); renderView(); renderPanel(); refocus('.drawer [data-dstep="' + a('data-dstep') + '"]'); return; }
    if (b.hasAttribute('data-dst')) {
      if (P.id) { setStatut(X, a('data-dst')); save(); renderView(); } else X.st = a('data-dst');
      renderPanel(); refocus('.drawer [data-dst="' + X.st + '"]'); return;
    }
    if (b.hasAttribute('data-save')) {
      var nmF = P.kind === 'sup' ? 't' : 'titre';
      if (!String(X[nmF] || '').trim()) { P.err = true; renderPanel(); refocus(P.kind === 'sup' ? '#f-t' : '#f-titre'); return; }
      save(); renderView(); closePanel(); toast('Enregistré'); return;
    }
    if (b.hasAttribute('data-create')) {
      if (P.kind === 'sup') {
        if (!X.t.trim()) { P.err = true; renderPanel(); refocus('#f-t'); return; }
        var ns = JSON.parse(JSON.stringify(X)); ns.id = uid('n'); ns.t = ns.t.trim(); var wanted = ns.st; ns.st = 'À lancer';
        D.sups.push(ns); setStatut(ns, wanted); save(); ui.panel = null; renderPanel(); renderView(); toast('Support ajouté');
      } else {
        if (!X.titre.trim()) { P.err = true; renderPanel(); refocus('#f-titre'); return; }
        var nt = JSON.parse(JSON.stringify(X)); nt.id = uid('t'); nt.titre = nt.titre.trim();
        D.tasks.push(nt); save(); ui.panel = null; renderPanel(); renderView(); toast('Tâche ajoutée');
      }
      return;
    }
    if (b.hasAttribute('data-tdone-panel') && P.kind === 'task') { X.done = X.done ? 0 : Date.now(); save(); renderView(); closePanel(); toast(X.done ? 'Rangé dans « Terminé »' : 'Remis dans « À faire »'); return; }
    if (b.hasAttribute('data-del') && P.id) {
      if (!P.confirmDel) { P.confirmDel = true; renderPanel(); refocus('.drawer [data-del]'); return; }
      if (P.kind === 'sup') { D.sups = D.sups.filter(function (s) { return s.id !== P.id; }); Object.keys(D.done).forEach(function (k) { if (k.indexOf(P.id + ':') === 0) delete D.done[k]; }); }
      else D.tasks = D.tasks.filter(function (t) { return t.id !== P.id; });
      save(); ui.panel = null; renderPanel(); renderView(); toast('Supprimé'); return;
    }
  }
  // budget
  if (b.hasAttribute('data-ok')) { var ai = b.parentNode.querySelector('.amt'); if (ai) { commitAmt(ai); ai.focus(); } return; }
  if (b.hasAttribute('data-badd')) {
    var nl = { id: uid('b'), name: 'Nouvelle ligne', desc: '', b: null, pv: null, ef: null, subs: [] };
    D.budget.push(nl); save(); renderView(); var ni = document.querySelector('[data-bn="' + nl.id + '"]'); if (ni) { ni.focus(); ni.select(); } return;
  }
  if (b.hasAttribute('data-badd-sub')) {
    var r = bFind(a('data-badd-sub')); if (!r) return;
    var L = r.line, sub = { id: uid('s'), name: 'Nouveau sous-poste', b: null, pv: null, ef: null };
    if (!L.subs.length && (L.pv || L.ef)) { sub.pv = L.pv; sub.ef = L.ef; L.pv = null; L.ef = null; }
    L.subs.push(sub); save(); renderView(); var si = document.querySelector('[data-bn="' + L.id + '/' + sub.id + '"]'); if (si) { si.focus(); si.select(); } return;
  }
  if (b.hasAttribute('data-bdel')) {
    var id = a('data-bdel');
    if (ui.arm !== id) { ui.arm = id; renderView(); refocus('[data-bdel="' + id + '"]'); return; }
    ui.arm = null;
    var pr = id.split('/');
    if (pr.length === 1) D.budget = D.budget.filter(function (x) { return x.id !== id; });
    else { var rr = bFind(id); if (rr) rr.line.subs = rr.line.subs.filter(function (x) { return x.id !== pr[1]; }); }
    save(); renderView(); toast('Ligne supprimée'); return;
  }
});
function exportBackup() {
  try {
    var blob = new Blob([JSON.stringify({ app: 'kunz-gestion', saved: new Date().toISOString(), data: D }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'), d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = 'kunz-sauvegarde-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('Sauvegarde exportée');
  } catch (e) { toast('Export impossible sur cet appareil'); }
}
document.addEventListener('click', function (e) { if (e.target.closest('[data-export]')) exportBackup(); });
document.getElementById('importfile').addEventListener('change', function (e) {
  var file = e.target.files && e.target.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var j = JSON.parse(r.result), data = j && j.data ? j.data : j;
      if (!data || !Array.isArray(data.sups)) throw new Error('format');
      D = normalize(data); save(); ui.panel = null; render(); toast('Sauvegarde importée');
    } catch (er) { toast('Ce fichier n’est pas une sauvegarde Kunz'); }
    e.target.value = '';
  };
  r.readAsText(file);
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.classList && t.classList.contains('amt')) t.classList.add('dirty');
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-f') && ui.panel) {
    var X = panelTarget(); if (!X) return;
    var f = t.getAttribute('data-f'), v = t.value;
    if (['p', 'l', 'd'].indexOf(f) >= 0 && ui.panel.kind === 'sup') { v = isoOk(v); if (!v && ui.panel.id) delete D.done[X.id + ':' + f]; }
    if (f === 'd' && ui.panel.kind === 'task') v = isoOk(v);
    X[f] = v;
    if (ui.panel.kind === 'sup' && ui.panel.id) syncSt(X, D.done);
    if ((f === 't' || f === 'titre') && v.trim() && ui.panel.err) { ui.panel.err = false; var er = document.querySelector('.drawer .err'); if (er) er.remove(); }
    if (ui.panel.id) {
      save(); renderView();
      if (['p', 'l', 'd'].indexOf(f) >= 0) { var sb = document.querySelector('.drawer [data-dstep="' + f + '"]'); if (sb) { sb.disabled = !v; } }
    }
    return;
  }
  if (t.hasAttribute('data-ba')) { commitAmt(t); return; }
  if (t.hasAttribute('data-bn')) { var r = bFind(t.getAttribute('data-bn')); if (r && r.item.name !== t.value) { r.item.name = t.value; save(); } return; }
  if (t.hasAttribute('data-bd')) { var r2 = bFind(t.getAttribute('data-bd')); if (r2 && r2.item.desc !== t.value) { r2.item.desc = t.value; save(); } return; }
  if (t.hasAttribute('data-notes')) { if (D.notes !== t.value) { D.notes = t.value; save(); } return; }
});
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t.classList && t.classList.contains('amt')) { e.preventDefault(); commitAmt(t); return; }
  if (e.key === 'Enter' && t.id === 'f-np') { e.preventDefault(); var ab = document.querySelector('.drawer [data-addp]'); if (ab) ab.click(); return; }
  if (e.key === 'Enter' && t.classList && (t.classList.contains('nm') || t.classList.contains('ds'))) { e.preventDefault(); t.blur(); return; }
  if (e.key === 'Escape' && ui.panel) { var act = document.activeElement; if (act && act.blur) act.blur(); closePanel(); }
});
document.addEventListener('focusout', function () {
  setTimeout(function () { if (sync.pendingRemote && !isEditing()) applyRemote(sync.pendingRemote); }, 0);
});
document.getElementById('q').addEventListener('input', function (e) { ui.q = e.target.value; renderView(); });

render();
setStatus('local');
initSync();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

// écran de chargement : une seconde au premier affichage
var splash = document.getElementById('splash');
var SPLASH_MS = 2600; // durée de l'écran de chargement, en millisecondes
var splashGone = false;
function hideSplash() { if (splashGone) return; splashGone = true; splash.classList.add('out'); setTimeout(function () { splash.remove(); }, 400); }
setTimeout(hideSplash, SPLASH_MS);
splash.addEventListener('click', hideSplash);

// fonctionnement hors ligne une fois installée (sauf dans un aperçu intégré)
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  try { navigator.serviceWorker.register('sw.js'); } catch (e) {}
}
})();
</script>
