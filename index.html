<style>
@font-face{font-family:'Gravur Cond';src:url('fonts/GravurLLTT-CondBold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Gravur Cond';src:url('fonts/GravurLLTT-CondBlack.ttf') format('truetype');font-weight:900;font-display:swap}
@font-face{font-family:'Akkurat';src:url('fonts/AkkuratLLTT-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Akkurat';src:url('fonts/AkkuratLLTT-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{
  --bg:#0B0E09; --card:#151A12; --card2:#1D2419; --line:#232A1E; --sunk:#0F130C;
  --text:#F3F4EC; --muted:#B9C0AE; --faint:#A3AC98; --soft:#C9CDBE;
  --accent:#cdce00; --late:#ec6907; --p:#65b32e; --l:#c3bd7a; --d:#cdce00;
  --display:'Gravur Cond','Arial Narrow',sans-serif;
  --body:'Akkurat','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Écran de chargement */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .photo{flex:1 1 64%;min-height:0;background:#0B0E09 url('img/kunz-photo.jpg') center 42%/cover no-repeat}
#splash .band{flex:0 0 auto;padding:28px 26px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;color:var(--accent)}
#splash .k{font-family:var(--display);font-weight:900;font-size:104px;line-height:.8;margin:0}
#splash .ph{font-family:var(--display);font-weight:700;font-size:46px;line-height:.92;margin:8px 0 0}
#splash .gp{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
#splash .gp:before{content:"";width:32px;height:3px;background:var(--accent)}
#splash .bar{height:3px;background:rgba(205,206,0,.22);border-radius:2px;overflow:hidden}
#splash .bar i{display:block;height:3px;width:0;background:var(--accent);animation:load 1.1s ease forwards}
@keyframes load{to{width:100%}}
@media (min-width:760px){#splash{flex-direction:row}#splash .photo{flex:1 1 55%}#splash .band{flex:0 0 420px;justify-content:flex-end;padding:48px}}
@media (prefers-reduced-motion:reduce){#splash .bar i{animation:none;width:100%}#splash{transition:none}}

/* Barre du haut */
header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;background:rgba(11,14,9,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--card2)}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--accent);font-family:var(--display)}
.brand b{font-weight:900;font-size:32px;line-height:.85}
.brand span{font-weight:700;font-size:17px;line-height:1}
nav.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border-radius:24px;max-width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs button{height:40px;padding:0 16px;border:0;border-radius:20px;background:transparent;color:var(--soft);font-weight:700;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--bg)}
.search{flex:1 1 220px;display:flex;justify-content:flex-end;min-width:0}
.search label{flex:0 1 340px;min-width:0;height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-radius:21px;color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text)}
.search input::placeholder{color:var(--faint)}
@media (max-width:640px){header{gap:10px 12px;padding-left:16px;padding-right:16px}.brand span{display:none}nav.tabs{order:3;width:100%}nav.tabs button{flex:1;padding:0 8px}.search{flex:1 1 120px}}

/* Contenu */
main{position:relative;max-width:1120px;margin:0 auto;padding:24px 20px calc(56px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.pagehead small{display:block;color:var(--muted);font-size:14px}
h1{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:46px;line-height:.95}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.group{display:flex;flex-direction:column;gap:8px}
.grouphead{display:flex;align-items:center;gap:10px;padding:0 2px}
.badge{min-width:26px;height:26px;padding:0 8px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.card{background:var(--card);border-radius:18px}
.empty{margin:0;padding:16px 18px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:4px;flex-shrink:0;display:inline-block}
.check{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:22px;border:1.5px solid #5A6750;background:transparent;color:var(--bg);padding:0}
.check.on{border:0;background:var(--accent)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar,nav.tabs::-webkit-scrollbar{display:none}

/* Agenda */
.countdown{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;padding:18px 22px;background:var(--accent);color:var(--bg);border-radius:22px}
.countdown b{font-family:var(--display);font-weight:900;font-size:72px;line-height:.82}
.countdown span{font-weight:700;font-size:16px}
.milestone{flex-shrink:0;display:flex;flex-direction:column;gap:2px;padding:10px 14px}
.milestone strong{font-size:15px;white-space:nowrap}
.ev{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px}
.ev .date{width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.ev .date b{font-family:var(--display);font-weight:700;font-size:28px;line-height:.9}
.ev .date span{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ev .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ev .t{font-weight:700;font-size:16px;line-height:1.25}
.ev .s{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.done .t{color:#8F9886;text-decoration:line-through}

/* Supports */
.chip{flex-shrink:0;height:38px;padding:0 14px;border:0;border-radius:19px;background:var(--card);color:var(--soft);font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 2px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sup{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 14px 12px 16px}
.sup.sel{background:var(--line)}
.sup .open{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:3px;padding:2px 0;border:0;background:transparent;text-align:left}
.sup .open b{font-size:16px;line-height:1.25}
.sup .open span{font-size:13px;line-height:1.3;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border:0;border-radius:18px;background:var(--sunk);color:var(--text);font-weight:700;font-size:14px;white-space:nowrap}
.pill.on{background:rgba(205,206,0,.16);color:var(--accent)}
.pill.none{border:1px dashed #4A5641;background:transparent;color:var(--muted);font-weight:400;font-size:13px;cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:20;width:420px;max-width:100%;overflow-y:auto;background:var(--card);border-left:1px solid var(--line);box-shadow:-24px 0 48px rgba(0,0,0,.45);padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.drawer .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer h2{font-size:30px;line-height:1.02;margin-top:6px}
.drawer .full{font-size:14px;color:var(--muted);margin-top:6px}
.close{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:22px;background:var(--line);padding:0}
.step{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--sunk);border-radius:16px}
.step .check{width:32px;height:32px;border-radius:16px}
.step .row{flex:1;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field b{font-size:16px}
.scrim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.4);border:0;padding:0}

/* Budget */
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1 1 150px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat b{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;white-space:nowrap}
.stat.hi{background:var(--accent);color:var(--bg)}
.stat.hi .eyebrow{color:var(--bg)}
.stat.over{background:var(--late);color:var(--bg)}
.stat.over .eyebrow{color:var(--bg)}
.poste{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.poste .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.poste .top div{display:flex;flex-direction:column;gap:2px;min-width:0}
.poste .top .r{align-items:flex-end;flex-shrink:0}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:6px;border-radius:3px}
.small{font-size:13px;color:var(--muted)}
.total{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--card2);border-radius:18px;font-weight:700}
.quote{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 14px;padding:14px 16px}
.quote .who{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:3px}
.quote .edit{display:flex;gap:8px;align-items:center}
.quote input,.quote select{height:40px;border:0;border-radius:20px;background:var(--sunk);color:var(--text);padding:0 14px;font-weight:700}
.quote input{width:130px;text-align:right}
.quote select{padding-right:10px}

/* Contacts */
.contacts{display:flex;flex-wrap:wrap;gap:10px}
.contact{flex:1 1 300px;display:flex;gap:14px;align-items:center;padding:16px}
.avatar{width:46px;height:46px;flex-shrink:0;border-radius:23px;color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.contact .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tag{flex-shrink:0;height:26px;padding:0 10px;display:flex;align-items:center;border-radius:13px;background:var(--line);color:var(--accent);font-size:12px;font-weight:700;white-space:nowrap}
.note{font-size:13px;color:var(--faint);margin:0}
</style>
</head>

function fmtS(iso) { var d = toDate(iso); return d.getDate() + ' ' + MOIS[d.getMonth()]; }

// ---------- Agenda ----------
function renderAgenda() {

      map[key].keys.push(st[0]); map[key].labels.push(st[1]);

  });
  var evs = Object.keys(map).map(function (k) { return map[k]; })
    .filter(function (e) { return hit(e.s.t, e.s.f, e.s.q, e.s.k); })
    .sort(function (a, b) { return a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0; });
  function allDone(e) { return e.keys.every(function (k) { return isDone(e.s.id, k); }); }

    }, 0);
  }
  var total = POSTES.reduce(function (t, p) { return t + p[2]; }, 0);
  var planned = POSTES.reduce(function (t, p) { return t + sumFor(p[0], PLANNED); }, 0);
  var paid = POSTES.reduce(function (t, p) { return t + sumFor(p[0], ['Payé']); }, 0);
  var left = total - planned;
  var postes = POSTES.filter(function (p) { return hit(p[0], p[1]); }).map(function (p) {
    var pl = sumFor(p[0], PLANNED), pd = sumFor(p[0], ['Payé']), r = p[2] - pl, pct = Math.min(100, Math.round(pl / p[2] * 100));
    var col = r < 0 ? 'var(--late)' : 'var(--accent)';
    return '<div class="card poste"><div class="top"><div><b>' + esc(p[0]) + '</b>' + (p[1] ? '<span class="small">' + esc(p[1]) + '</span>' : '') + '</div>' +
      '<div class="r"><b style="color:' + col + ';white-space:nowrap">' + chf(r) + '</b><span class="small" style="white-space:nowrap">reste sur ' + chf(p[2]) + '</span></div></div>' +
      '<div class="meter" role="img" aria-label="' + pct + ' % du poste prévu"><i style="width:' + pct + '%;background:' + col + '"></i></div>' +
      '<span class="small">Prévu ' + chf(pl) + ' · Payé ' + chf(pd) + '</span></div>';
  }).join('');
  var quotes = QUOTES.filter(function (q) { return hit(q.who, q.what, q.poste); }).map(function (q) {
    var s = quoteState(q);
    return '<div class="card quote"><div class="who"><b>' + esc(q.who) + '</b><span class="small">' + esc(q.what) + ' · ' + esc(q.poste) + '</span></div>' +
      '<div class="edit"><label><span class="sr">Montant en CHF, ' + esc(q.who) + '</span><input type="number" inputmode="decimal" min="0" step="50" placeholder="Montant" data-amount="' + q.id + '" value="' + (s.amount != null ? esc(s.amount) : '') + '"></label>' +
      '<label><span class="sr">Statut, ' + esc(q.who) + '</span><select data-status="' + q.id + '">' + STATUSES.map(function (st) { return '<option' + (st === s.status ? ' selected' : '') + '>' + st + '</option>'; }).join('') + '</select></label></div></div>';
  }).join('');
  return '<div style="display:flex;flex-direction:column;gap:22px">' +
    '<div class="stats"><div class="card stat"><span class="eyebrow">Budget</span><b>' + chf(total) + '</b></div>' +
    '<div class="card stat"><span class="eyebrow">Prévu</span><b>' + chf(planned) + '</b></div>' +
    '<div class="card stat"><span class="eyebrow">Payé</span><b>' + chf(paid) + '</b></div>' +
    '<div class="card stat ' + (left < 0 ? 'over' : 'hi') + '"><span class="eyebrow">Reste</span><b>' + chf(left) + '</b></div></div>' +
    '<section class="group"><h2>Postes</h2>' + postes + '<div class="total"><span>Total intermédiaire</span><span>' + chf(total) + '</span></div></section>' +
    '<section class="group"><h2>Devis</h2><p class="note">Saisis le montant et le statut de chaque devis : le prévu et le reste se calculent seuls. « Prévu » compte les devis reçus, acceptés, facturés et payés.</p>' + quotes + '</section></div>';
}

// ---------- Contacts ----------
function renderContacts() {
  var list = CONTACTS.filter(function (c) { return hit(c[0], c[1]); }).map(function (c) {
    var n = SUP.filter(function (x) { return (x.q + ' ' + x.w).indexOf(c[2]) >= 0; }).length;
    var parts = c[0].split(' ').filter(function (w) { return /^[A-ZÉÈ]/.test(w); });
    var ini = (parts[0] || c[0])[0] + (parts[1] ? parts[1][0] : '');
    return '<div class="card contact"><span class="avatar" aria-hidden="true" style="background:' + c[3] + '">' + esc(ini) + '</span>' +
      '<div class="who"><b>' + esc(c[0]) + '</b><span class="small">' + esc(c[1]) + '</span></div>' +
      '<span class="tag">' + (n === 0 ? 'Aucun support' : n + (n > 1 ? ' supports' : ' support')) + '</span></div>';
  }).join('');
  return '<div class="contacts">' + (list || '<p class="card empty">Aucun contact ne correspond.</p>') + '</div>';
}

// ---------- rendu ----------
var TITLES = { agenda: 'Agenda', supports: 'Supports', budget: 'Budget', contacts: 'Contacts' };
function render() {
  document.querySelectorAll('nav.tabs button').forEach(function (b) {
    if (b.getAttribute('data-tab') === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  document.getElementById('title').textContent = TITLES[state.tab];
  var n = new Date();
  document.getElementById('today').textContent = JOURS[n.getDay()] + ' ' + n.getDate() + ' ' + MOIS[n.getMonth()] + ' ' + n.getFullYear();
  var v = state.tab === 'agenda' ? renderAgenda() : state.tab === 'supports' ? renderSupports() : state.tab === 'budget' ? renderBudget() : renderContacts();
  document.getElementById('view').innerHTML = v;
  document.getElementById('layer').innerHTML = renderDrawer();
}

// ---------- interactions ----------
document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-tab')) { state.tab = b.getAttribute('data-tab'); state.sel = null; render(); window.scrollTo(0, 0); return; }
  if (b.hasAttribute('data-cat')) { state.cat = b.getAttribute('data-cat'); render(); return; }
  if (b.hasAttribute('data-open')) { state.sel = b.getAttribute('data-open'); render(); var c = document.querySelector('.drawer .close'); if (c) c.focus(); return; }
  if (b.hasAttribute('data-close')) { var id = state.sel; state.sel = null; render(); var o = document.querySelector('[data-open="' + id + '"]'); if (o) o.focus(); return; }
  if (b.hasAttribute('data-step')) { var k = b.getAttribute('data-step'); state.done[k] = !state.done[k]; save(); render(); var again = document.querySelector('.drawer [data-step="' + k + '"]') || document.querySelector('[data-step="' + k + '"]'); if (again) again.focus(); return; }
  if (b.hasAttribute('data-ev')) {
    var parts = b.getAttribute('data-ev').split('|'), keys = parts[1].split(',');
    var all = keys.every(function (x) { return state.done[parts[0] + ':' + x]; });
    keys.forEach(function (x) { state.done[parts[0] + ':' + x] = !all; });
    save(); render(); return;
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-status')) { var id = t.getAttribute('data-status'); state.quotes[id] = Object.assign({}, state.quotes[id], { status: t.value }); save(); render(); }
  if (t.hasAttribute('data-amount')) { var id2 = t.getAttribute('data-amount'); var val = t.value === '' ? null : Math.max(0, Number(t.value)); state.quotes[id2] = Object.assign({}, state.quotes[id2], { amount: val }); save(); render(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.sel) { state.sel = null; render(); } });
document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });

render();

// écran de chargement : une seconde au premier affichage
var splash = document.getElementById('splash');
setTimeout(function () { splash.classList.add('out'); setTimeout(function () { splash.remove(); }, 400); }, 1150);

// fonctionnement hors ligne une fois installée (sauf dans un aperçu intégré)
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  try { navigator.serviceWorker.register('sw.js'); } catch (e) {}
}
})();
</script>
</body>
</html>
